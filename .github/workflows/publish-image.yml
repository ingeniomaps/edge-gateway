name: Build and Publish Docker Image

on:
  workflow_call:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Extra tag to publish (e.g., develop, latest)'
        required: false

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check Docker credentials
        id: docker-creds
        run: |
          if [ -n "${{ secrets.DOCKER_USERNAME }}" ] && [ -n "${{ secrets.DOCKER_PASSWORD }}" ]; then
            echo "has_credentials=true" >> $GITHUB_OUTPUT
          else
            echo "has_credentials=false" >> $GITHUB_OUTPUT
          fi

      - name: Log in to Docker Hub
        if: steps.docker-creds.outputs.has_credentials == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            # Inmutable (SHA)
            type=sha

            # Tags de branch (develop, main)
            type=ref,event=branch

            # Tags semver (v1.2.3, v1.2)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

            # latest solo desde main
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

            # Tag manual (workflow_dispatch)
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ steps.docker-creds.outputs.has_credentials == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        if: steps.docker-creds.outputs.has_credentials == 'true'
        run: |
          echo "Image pushed successfully"
          echo "Digest: ${{ steps.meta.outputs.digest }}"

      - name: Build only (no push - credentials not configured)
        if: steps.docker-creds.outputs.has_credentials == 'false'
        run: |
          echo "⚠️  DOCKER_USERNAME or DOCKER_PASSWORD not configured"
          echo "Building image locally (not pushing to registry)"
